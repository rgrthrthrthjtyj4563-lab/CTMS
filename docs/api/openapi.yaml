openapi: 3.0.3
info:
  title: AIC-DCT API
  version: 0.1.0
  description: |
    AIC-DCT backend API contract (Phase 0). Every endpoint is registered but
    returns a typed 501 with the canonical error envelope until later
    phases fill in the handlers.

    Every error response conforms to:
    ```
    { "code": "ERROR_CODE", "message": "...", "details": {}, "requestId": "..." }
    ```
servers:
  - url: http://localhost:4000
    description: Local dev server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum:
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - VALIDATION_ERROR
            - CONFLICT
            - STATE_TRANSITION_INVALID
            - CONFIRMATION_REQUIRED
            - REASON_REQUIRED
            - MASKING_REQUIRED
            - AI_CONFIRMATION_REQUIRED
            - AUDIT_REQUIRED
            - RATE_LIMITED
            - INTERNAL
        message: { type: string }
        details:
          type: object
          additionalProperties: true
        requestId: { type: string }

    Role:
      type: string
      enum: [SponsorAdmin, CROPM, SitePI, SiteCRC, CRA, Auditor, RegulatorReadOnly, Subject, ProviderLogistics, ProviderNurse, SystemAdmin]

    ProtocolParseStatus:
      type: string
      enum: [Uploaded, Parsing, Parsed, ParseFailed, UnderReview, Effective, Superseded]
    HumanConfirmationStatus:
      type: string
      enum: [Pending, Adopted, EditedAdopted, Rejected, NeedsInvestigatorConfirmation]
    SubjectStatus:
      type: string
      enum: [PreScreening, Consenting, Screening, Enrolled, Active, Completed, Withdrawn, ScreenFailed]
    VisitStatus:
      type: string
      enum: [NotStarted, Scheduled, InProgress, SubmittedForPI, Completed, Missed, OutOfWindow, Deviation]
    ConsentStatus:
      type: string
      enum: [NotStarted, Reading, ComprehensionPending, SubjectSigned, InvestigatorSigned, Completed, ReConsentRequired, Withdrawn]
    QuestionnaireStatus:
      type: string
      enum: [Scheduled, InProgress, Submitted, Missed, Late, Reviewed]
    SafetyEventStatus:
      type: string
      enum: [Draft, InvestigatorReview, ConfirmedAE, ConfirmedSAE, Reported, FollowUp, Closed]
    RiskLevel:
      type: string
      enum: [Low, Medium, High, Critical]
    RiskStatus:
      type: string
      enum: [Open, Assigned, InProgress, PendingInvestigator, Resolved, Closed, Rejected]
    ReportStatus:
      type: string
      enum: [Generating, Draft, UnderReview, Confirmed, Exported, Failed]

    Project:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        sponsor: { type: string }
        therapeuticArea: { type: string }
        phase: { type: string, enum: [I, II, III, IV] }
        startDate: { type: string, format: date-time }
        estimatedEndDate: { type: string, format: date-time, nullable: true }

    SubjectMasked:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        siteId: { type: string }
        subjectCode: { type: string }
        initials: { type: string, nullable: true }
        yearOfBirth: { type: integer, nullable: true }
        ageBand: { type: string, nullable: true }
        sex: { type: string, enum: [Male, Female, Other, Unknown], nullable: true }
        city: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/SubjectStatus' }

    SubjectFull:
      allOf:
        - $ref: '#/components/schemas/SubjectMasked'
        - type: object
          properties:
            fullName: { type: string }
            nationalId: { type: string }
            dateOfBirth: { type: string, format: date }
            phone: { type: string }
            email: { type: string, format: email }
            address: { type: string }

    SafetyEvent:
      type: object
      properties:
        id: { type: string }
        subjectId: { type: string }
        onsetAt: { type: string, format: date-time }
        description: { type: string }
        severity: { $ref: '#/components/schemas/RiskLevel' }
        status: { $ref: '#/components/schemas/SafetyEventStatus' }
        isSerious: { type: boolean }
        aiSuggested: { type: boolean }

    RiskSignal:
      type: object
      properties:
        id: { type: string }
        level: { $ref: '#/components/schemas/RiskLevel' }
        type: { type: string }
        objectType: { type: string }
        objectId: { type: string }
        trigger: { type: string }
        suggestion: { type: string, nullable: true }
        ownerUserId: { type: string, nullable: true }
        deadline: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/RiskStatus' }
        aiOutputId: { type: string, nullable: true }

    AIOutput:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        projectId: { type: string }
        subjectId: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true }
        confidence: { type: number, minimum: 0, maximum: 1 }
        confidenceLevel: { type: string, enum: [Low, Medium, High] }
        status: { $ref: '#/components/schemas/HumanConfirmationStatus' }
        model: { type: string }
        modelVersion: { type: string }
        promptTemplateId: { type: string, nullable: true }
        inputHash: { type: string }
        knowledgeBaseRefs: { type: array, items: { type: string } }
        generatedAt: { type: string, format: date-time }
        confirmedByUserId: { type: string, nullable: true }
        confirmedAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string, nullable: true }

    AuditEvent:
      type: object
      properties:
        id: { type: string }
        actorUserId: { type: string }
        actorRole: { $ref: '#/components/schemas/Role' }
        projectId: { type: string }
        objectType: { type: string }
        objectId: { type: string }
        action: { type: string }
        beforeValue: { type: object, additionalProperties: true, nullable: true }
        afterValue: { type: object, additionalProperties: true, nullable: true }
        reason: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        device: { type: string, nullable: true }
        requestId: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }

security:
