        - { name: category, in: query, schema: { type: string, enum: [Protocol, ICF, Manual, EthicsApproval, VisitForm, SAEReport, Other] } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
