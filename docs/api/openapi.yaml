        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    post:
      summary: Create a document (DocumentUpload; requires title + category)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, category]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                category: { type: string, enum: [Protocol, ICF, Manual, EthicsApproval, VisitForm, SAEReport, Other] }
                initialVersion:
                  type: object
                  properties:
                    version: { type: string, minLength: 1, maxLength: 40, default: v1 }
                    fileUrl: { type: string, minLength: 1, maxLength: 2000 }
                    sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Document created (audited)
