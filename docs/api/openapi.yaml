  /api/ai-config/configs:
    get:
      summary: List AI configs (project-scoped via resolveProjectScope)
      description: |
        R2 closure. Returns both project-scoped and global (projectId=null)
        configs. When `?projectId=` is supplied the caller must hold an
        assignment on that project; otherwise 403. Permission: `ai:config.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIConfigListResponse' }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /api/ai-config/configs/{configId}:
    parameters:
      - { name: configId, in: path, required: true, schema: { type: string } }
    put:
      summary: Update AI config (project-scoped via resolveActorRoleForProject)
      description: |
        R1 + R2 closure. The config's `projectId` is used to resolve the
        caller's role assignment; a Sponsor on project A cannot update a
        config on project B using their project-A role. Global configs
        (projectId=null) require `ai:config.update` and are effectively
        SystemAdmin-only (matrix gates the permission).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIConfigUpdateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIConfig' }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /api/ai-config/prompts:
    get:
      summary: List prompt templates (global, platform-level)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromptTemplateListResponse' }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    post:
      summary: Create new prompt template version
      description: |
        Always creates a NEW row; existing versions are immutable. The
        new version's label is auto-incremented from the previous one
        unless the caller supplies an unused `version` (which must be
        unique per `code`). Permission: `ai:config.update`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromptTemplateCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromptTemplate' }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Version label already exists, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /api/ai-config/outputs:
    get:
      summary: List AI outputs (project-scoped review queue)
      description: |
        R2 closure. Defaults `status=Pending`; ?projectId= is honored only
        when the caller has an assignment on it. Permission: `ai:output.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/HumanConfirmationStatus' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIOutputListResponse' }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /api/ai-config/outputs/{outputId}/adopt:
    parameters:
      - { name: outputId, in: path, required: true, schema: { type: string } }
    post:
      summary: Adopt AI output (Pending → Adopted, atomic with audit)
      description: |
        R1 closure. The output's `projectId` resolves the actor's role;
        the permission `ai:output.adopt` is evaluated against that role
        only. State change is wrapped with the audit event in a single
        transaction.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIOutputAdoptRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIOutputAdoptResponse' }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Illegal lifecycle transition, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /api/ai-config/outputs/{outputId}/reject:
    parameters:
      - { name: outputId, in: path, required: true, schema: { type: string } }
    post:
      summary: Reject AI output (Pending → Rejected, reason required)
      description: |
        Same R1 closure as adopt. `reason` is mandatory and is enforced by
        `CRITICAL_AUDIT_PAIRS` (requiresReason: true on AIOutputRejected).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 2000 }
                notes:  { type: string, maxLength: 2000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIOutputRejectResponse' }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Illegal lifecycle transition, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /api/ai-config/call-logs:
    get:
      summary: List AI call logs (project-scoped via linked AIOutput.projectId)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AICallLogListResponse' }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /api/audit/events:
    get:
      summary: List audit events (project-scoped, AuditRead)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
        - { name: objectType, in: query, schema: { $ref: '#/components/schemas/AuditObjectType' } }
        - { name: action, in: query, schema: { type: string, maxLength: 80 } }
        - { name: actorUserId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventListResponse' }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /api/audit/exports:
    get:
      summary: List audit exports (project-scoped)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditExportListResponse' }
    post:
      summary: Create an audit export (AuditExport; reason required; ExportRecord + AuditEvent)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, format]
              properties:
                reason: { type: string, minLength: 1, maxLength: 2000 }
                format: { type: string, enum: [CSV, PDF, XLSX, JSON], default: PDF }
                filters:
                  type: object
                  properties:
                    projectId: { type: string }
                    objectType: { $ref: '#/components/schemas/AuditObjectType' }
                    action: { type: string, maxLength: 80 }
                    actorUserId: { type: string }
                    from: { type: string, format: date-time }
                    to: { type: string, format: date-time }
      responses:
        '200':
          description: ExportRecord created and audited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditExportRecord' }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
