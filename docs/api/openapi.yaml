openapi: 3.0.3
info:
  title: AIC-DCT API
  version: 0.1.0
  description: |
    AIC-DCT backend API contract. Some Phase 4A Subject endpoints are still
    planned and MUST be added here in the same change that implements them;
    this document must not claim that a planned route is already available.

    Authorization is permission plus scope. List, aggregate, and export
    endpoints resolve an authorized project scope; detail and mutation
    endpoints verify the target object's project and evaluate the actor's
    role in that target project. Subject endpoints additionally derive the
    bound subject/project from authenticated identity and never trust a
    client-supplied subjectId or projectId to widen access.

    AI adopt/reject endpoints do not by themselves make an AI workflow
    compliant. Any endpoint that promotes AI-derived content into a formal
    record, including AI-derived protocol activation and report confirmation,
    must accept only Adopted or EditedAdopted output and must verify project,
    output kind, target object, and version. Purely human-authored records use
    an explicit non-AI path.

    Subject-originated source data cannot be silently overwritten by Web
    users. Approved assisted entry is a distinct, attributed, reasoned,
    persistently labelled, audited record and is never represented as Subject
    self-entry.

    Every error response conforms to:
    ```
    { "code": "ERROR_CODE", "message": "...", "details": {}, "requestId": "..." }
    ```
servers:
  - url: http://localhost:4000
    description: Local dev server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum:
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - VALIDATION_ERROR
            - CONFLICT
            - STATE_TRANSITION_INVALID
            - CONFIRMATION_REQUIRED
            - REASON_REQUIRED
            - MASKING_REQUIRED
            - AI_CONFIRMATION_REQUIRED
            - AUDIT_REQUIRED
            - RATE_LIMITED
            - INTERNAL
        message: { type: string }
        details:
          type: object
          additionalProperties: true
        requestId: { type: string }

    Role:
      type: string
      enum: [SponsorAdmin, CROPM, SitePI, SiteCRC, CRA, Auditor, RegulatorReadOnly, Subject, ProviderLogistics, ProviderNurse, SystemAdmin]

    ProtocolParseStatus:
      type: string
      enum: [Uploaded, Parsing, Parsed, ParseFailed, UnderReview, Effective, Superseded]
    HumanConfirmationStatus:
      type: string
      enum: [Pending, Adopted, EditedAdopted, Rejected, NeedsInvestigatorConfirmation]
    SubjectStatus:
      type: string
      enum: [PreScreening, Consenting, Screening, Enrolled, Active, Completed, Withdrawn, ScreenFailed]
    VisitStatus:
      type: string
      enum: [NotStarted, Scheduled, InProgress, SubmittedForPI, Completed, Missed, OutOfWindow, Deviation]
    ConsentStatus:
      type: string
      enum: [NotStarted, Reading, ComprehensionPending, SubjectSigned, InvestigatorSigned, Completed, ReConsentRequired, Withdrawn]
    QuestionnaireStatus:
      type: string
      enum: [Scheduled, InProgress, Submitted, Missed, Late, Reviewed]
    SafetyEventStatus:
      type: string
      enum: [Draft, InvestigatorReview, ConfirmedAE, ConfirmedSAE, Reported, FollowUp, Closed]
    RiskLevel:
      type: string
      enum: [Low, Medium, High, Critical]
    RiskStatus:
      type: string
      enum: [Open, Assigned, InProgress, PendingInvestigator, Resolved, Closed, Rejected]
    ReportStatus:
      type: string
      enum: [Generating, Draft, UnderReview, Confirmed, Exported, Failed]

    Project:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        sponsor: { type: string }
        therapeuticArea: { type: string }
        phase: { type: string, enum: [I, II, III, IV] }
        startDate: { type: string, format: date-time }
        estimatedEndDate: { type: string, format: date-time, nullable: true }

    SubjectMasked:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        siteId: { type: string }
        subjectCode: { type: string }
        initials: { type: string, nullable: true }
        yearOfBirth: { type: integer, nullable: true }
        ageBand: { type: string, nullable: true }
        sex: { type: string, enum: [Male, Female, Other, Unknown], nullable: true }
        city: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/SubjectStatus' }

    SubjectFull:
      allOf:
        - $ref: '#/components/schemas/SubjectMasked'
        - type: object
          properties:
            fullName: { type: string }
            nationalId: { type: string }
            dateOfBirth: { type: string, format: date }
            phone: { type: string }
            email: { type: string, format: email }
            address: { type: string }

    SafetyEvent:
      type: object
      properties:
        id: { type: string }
        subjectId: { type: string }
        onsetAt: { type: string, format: date-time }
        description: { type: string }
        severity: { $ref: '#/components/schemas/RiskLevel' }
        status: { $ref: '#/components/schemas/SafetyEventStatus' }
        isSerious: { type: boolean }
        aiSuggested: { type: boolean }

    RiskSignal:
      type: object
      properties:
        id: { type: string }
        level: { $ref: '#/components/schemas/RiskLevel' }
        type: { type: string }
        objectType: { type: string }
        objectId: { type: string }
        trigger: { type: string }
        suggestion: { type: string, nullable: true }
        ownerUserId: { type: string, nullable: true }
        deadline: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/RiskStatus' }
        aiOutputId: { type: string, nullable: true }

    AIOutput:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        projectId: { type: string }
        subjectId: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true }
        confidence: { type: number, minimum: 0, maximum: 1 }
        confidenceLevel: { type: string, enum: [Low, Medium, High] }
        status: { $ref: '#/components/schemas/HumanConfirmationStatus' }
        model: { type: string }
        modelVersion: { type: string }
        promptTemplateId: { type: string, nullable: true }
        inputHash: { type: string }
        knowledgeBaseRefs: { type: array, items: { type: string } }
        generatedAt: { type: string, format: date-time }
        confirmedByUserId: { type: string, nullable: true }
        confirmedAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string, nullable: true }

    AuditEvent:
      type: object
      properties:
        id: { type: string }
        actorUserId: { type: string }
        actorRole: { $ref: '#/components/schemas/Role' }
        projectId: { type: string }
        objectType: { type: string }
        objectId: { type: string }
        action: { type: string }
        beforeValue: { type: object, additionalProperties: true, nullable: true }
        afterValue: { type: object, additionalProperties: true, nullable: true }
        reason: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        device: { type: string, nullable: true }
        requestId: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }

    Report:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        type: { type: string, enum: [Interim, Final, Safety, Custom] }
        status: { $ref: '#/components/schemas/ReportStatus' }
        sourceSnapshotId: { type: string, nullable: true }
        generatedAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time, nullable: true }
        exportedAt: { type: string, format: date-time, nullable: true }

    ReportListResponse:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/Report' }

    ReportDetail:
      type: object
      properties:
        report: { $ref: '#/components/schemas/Report' }
        aiOutput: { $ref: '#/components/schemas/AIOutput', nullable: true }
        exportRecord:
          type: object
          nullable: true
          properties:
            id: { type: string }
            projectId: { type: string }
            objectType: { type: string }
            objectIds:
              type: array
              items: { type: string }
            format: { type: string, enum: [CSV, PDF, XLSX, JSON] }
            reason: { type: string }
            exportedByUserId: { type: string }
            exportedAt: { type: string, format: date-time }
        auditTrail:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }

    Document:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        title: { type: string }
        category: { type: string, enum: [Protocol, ICF, Manual, EthicsApproval, VisitForm, SAEReport, Other] }
        currentVersionId: { type: string, nullable: true }
        uploadedByUserId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    DocumentListResponse:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/Document' }

    DocumentVersion:
      type: object
      properties:
        id: { type: string }
        documentId: { type: string }
        version: { type: string }
        fileUrl: { type: string }
        sha256: { type: string }
        uploadedByUserId: { type: string }
        uploadedAt: { type: string, format: date-time }
        isCurrent: { type: boolean }

    DocumentDetail:
      type: object
      properties:
        document: { $ref: '#/components/schemas/Document' }
        versions:
          type: array
          items: { $ref: '#/components/schemas/DocumentVersion' }
        auditTrail:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }

    DocumentVersionsResponse:
      type: object
      properties:
        documentId: { type: string }
        currentVersionId: { type: string, nullable: true }
        versions:
          type: array
          items: { $ref: '#/components/schemas/DocumentVersion' }

    AuditObjectType:
      type: string
      enum: [Project, ProtocolVersion, Subject, Consent, Visit, QuestionnaireResponse, SafetyEvent, RiskSignal, DrugShipment, SampleTransfer, ReportDraft, ExportRecord, Document, AIConfig, AIOutput, User, AuditExport]

    AuditEventListResponse:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }

    AuditExportRecord:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        objectType: { type: string }
        format: { type: string, enum: [CSV, PDF, XLSX, JSON] }
        reason: { type: string }
        exportedByUserId: { type: string }
        exportedAt: { type: string, format: date-time }

    AuditExportListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditExportRecord' }

    # ── AI 中台配置 (Task 3.6) ──────────────────────────────────
    AIConfig:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string, nullable: true }
        provider: { type: string }
        model: { type: string }
        temperature: { type: number, format: float }
        maxTokens: { type: integer, nullable: true }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AIConfigUpdateRequest:
      type: object
      properties:
        provider: { type: string, minLength: 1, maxLength: 80 }
        model: { type: string, minLength: 1, maxLength: 120 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        maxTokens: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        enabled: { type: boolean }

    AIConfigListResponse:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/AIConfig' }

    PromptTemplate:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        version: { type: string }
        body: { type: string }
        variables:
          type: array
          items: { type: string }
        outputKind: { type: string }
        createdAt: { type: string, format: date-time }

    PromptTemplateCreateRequest:
      type: object
      required: [code, body, outputKind]
      properties:
        code: { type: string, minLength: 1, maxLength: 80 }
        body: { type: string, minLength: 1, maxLength: 20000 }
        variables:
          type: array
          items: { type: string, minLength: 1, maxLength: 80 }
          default: []
        outputKind: { type: string, minLength: 1, maxLength: 80 }
        version: { type: string, minLength: 1, maxLength: 40 }

    PromptTemplateListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PromptTemplate' }

    AIOutputSummary:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        projectId: { type: string }
        subjectId: { type: string, nullable: true }
        confidence: { type: number, format: float, nullable: true }
        confidenceLevel: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/HumanConfirmationStatus' }
        model: { type: string }
        modelVersion: { type: string, nullable: true }
        inputHash: { type: string }
        promptTemplateCode: { type: string, nullable: true }
        promptVersion: { type: string, nullable: true }
        payload:
          type: object
          additionalProperties: true
        generatedAt: { type: string, format: date-time }
        confirmedByUserId: { type: string, nullable: true }
        confirmedByName: { type: string, nullable: true }
        confirmedAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        rejectionReason: { type: string, nullable: true }

    AIOutputListResponse:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/AIOutputSummary' }

    AIOutputAdoptRequest:
      type: object
      properties:
        notes: { type: string, maxLength: 2000 }

    AIOutputAdoptResponse:
      type: object
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/HumanConfirmationStatus' }
        confirmedByUserId: { type: string }
        confirmedAt: { type: string, format: date-time, nullable: true }

    AIOutputRejectResponse:
      type: object
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/HumanConfirmationStatus' }
        confirmedByUserId: { type: string }
        confirmedAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string, nullable: true }

    AICallLogItem:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        module: { type: string }
        caller: { type: string }
        inputHash: { type: string }
        model: { type: string }
        promptTemplateCode: { type: string, nullable: true }
        promptVersion: { type: string, nullable: true }
        aiOutputId: { type: string, nullable: true }
        aiOutputKind: { type: string, nullable: true }
        aiOutputStatus: { $ref: '#/components/schemas/HumanConfirmationStatus', nullable: true }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        statusCode: { type: integer, nullable: true }
        errorMessage: { type: string, nullable: true }

    AICallLogListResponse:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/AICallLogItem' }

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: ok
  /readyz:
    get:
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: ready

  /api/auth/login:
    post:
      summary: Login (Phase 2)
      security: []
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/auth/logout:
    post:
      summary: Logout
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/auth/session:
    get:
      summary: Get current session
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/projects:
    get:
      summary: List projects
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    post:
      summary: Create project
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/projects/{projectId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      summary: Get project
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    patch:
      summary: Update project
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/projects/{projectId}/archive:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    post:
      summary: Archive project
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/projects/{projectId}/dashboard:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      summary: Get project dashboard payload
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/projects/{projectId}/protocol/parse:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    post:
      summary: Trigger AI protocol parse (Phase 3)
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/projects/{projectId}/protocol/{versionId}/activate:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: versionId, in: path, required: true, schema: { type: string } }
    post:
      summary: Activate a protocol version (requires reason)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirmed]
              properties:
                reason: { type: string }
                confirmed: { type: boolean }
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/subjects:
    get:
      summary: List subjects (masked by default)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Subject list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SubjectMasked' }
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    post:
      summary: Create subject
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/subjects/{subjectId}:
    parameters:
      - { name: subjectId, in: path, required: true, schema: { type: string } }
    get:
      summary: Get subject (masked)
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/subjects/{subjectId}/identity/full:
    parameters:
      - { name: subjectId, in: path, required: true, schema: { type: string } }
    get:
      summary: Get subject full identity (audited; requires subject:read.full)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Subject full identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectFull' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/subjects/{subjectId}/status:
    parameters:
      - { name: subjectId, in: path, required: true, schema: { type: string } }
    patch:
      summary: Update subject status
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/SubjectStatus' }
                reason: { type: string }
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/subjects/{subjectId}/withdraw:
    parameters:
      - { name: subjectId, in: path, required: true, schema: { type: string } }
    post:
      summary: Withdraw subject
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/consent/documents:
    get:
      summary: List consent documents
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    post:
      summary: Create consent document
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/consent/tasks:
    get:
      summary: List consent tasks
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/consent/tasks/{taskId}/start:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string } }
    post:
      summary: Start consent reading
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/consent/tasks/{taskId}/sign:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string } }
    post:
      summary: Sign consent (audited)
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Not implemented in Phase 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/consent/tasks/{taskId}/re-consent:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string } }
    post:
